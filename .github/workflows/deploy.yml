name: Deploy Gist MCP OAuth

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "resource-server/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "wrangler.jsonc"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: MCP
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Type-check
        run: npm run check
      - name: Configure Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$OAUTH_CLIENT_SECRET"
          printf '%s' "$OAUTH_CLIENT_SECRET" | npx wrangler secret put GITHUB_OAUTH_CLIENT_SECRET
      - name: Deploy authorization server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

  deploy-resource-server:
    needs: deploy
    runs-on: ubuntu-latest
    environment: MCP
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Type-check
        run: npm run check
      - name: Deploy Gist MCP resource server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config resource-server/wrangler.jsonc
